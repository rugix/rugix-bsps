name: Build BSPs

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly rebuild to catch upstream branch changes.
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io/${{ github.repository }}

jobs:
  detect:
    if: github.event_name != 'pull_request'
    name: Detect changed BSPs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.detect.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Compute build hashes
        id: detect
        run: |
          matrix=$(mise run detect-changes -- --registry "$REGISTRY")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    name: "Build ${{ matrix.board }} (${{ matrix.release }})"
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build BSP
        run: |
          mise run build -- "${{ matrix.board }}" \
            --release "${{ matrix.release }}"

      - name: Push BSP to registry
        run: |
          mise run push -- \
            "output/${{ matrix.board }}_${{ matrix.release }}.bsp.tar.gz" \
            --registry "$REGISTRY"

  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
        with:
          install: false
      - name: Install Project Tools
        env:
          MISE_GITHUB_TOKEN: ${{ github.token }}
        run: mise install

      - run: mise run check
